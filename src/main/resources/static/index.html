<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', t === 'dark');
            if (t !== 'dark') {
                document.documentElement.style.backgroundColor = '#f1f5f9';
            } else {
                document.documentElement.style.backgroundColor = '#0f172a';
            }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartTravel</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"],
                        zh: ["Noto Sans SC", "sans-serif"],
                        ko: ["Noto Sans KR", "sans-serif"],
                        ja: ["Noto Sans JP", "sans-serif"]
                    },
                    animation: {
                        float: "float 6s ease-in-out infinite",
                        pulseSoft: "pulseSoft 2.6s ease-in-out infinite",
                        fadeUp: "fadeUp 0.35s ease-out"
                    },
                    keyframes: {
                        float:     { "0%, 100%": { transform: "translateY(0px)" }, "50%": { transform: "translateY(-10px)" } },
                        pulseSoft: { "0%,100%": { opacity: "1" }, "50%": { opacity: ".72" } },
                        fadeUp:    { "from": { opacity: "0", transform: "translateY(10px)" }, "to": { opacity: "1", transform: "translateY(0px)" } }
                    }
                }
            }
        };
    </script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- App CSS -->
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="dark font-sans antialiased">

<!-- Global loader -->
<div id="globalLoader" class="pointer-events-none fixed inset-0 z-[130] hidden items-center justify-center bg-slate-900/35 backdrop-blur-[1px]">
    <div class="glass flex items-center gap-3 rounded-2xl px-5 py-3 text-sm font-semibold">
        <i class="fa-solid fa-spinner fa-spin text-cyan-300"></i>
        <span data-i18n="common.loading"></span>
    </div>
</div>

<!-- Background blobs  -->
<div class="pointer-events-none fixed inset-0 -z-10">
    <div class="absolute -left-20 top-12 h-80 w-80 rounded-full bg-cyan-500/20 blur-3xl"></div>
    <div class="absolute right-0 top-1/3 h-96 w-96 rounded-full bg-indigo-500/20 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-96 w-96 rounded-full bg-emerald-500/15 blur-3xl"></div>
</div>

<!-- Navbar -->
<nav id="mainNavbar" class="sticky top-0 z-50 transition-all duration-300">
    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 md:px-8">
        <button class="flex items-center gap-3" onclick="showPage('home')">
            <img src="images/logo.png" alt="logo" class="h-11 w-11 rounded-xl object-contain bg-white/10 p-1" />
            <div class="text-left">
                <p class="text-xl font-black tracking-tight"><span class="text-cyan-300">Smart</span><span>Travel</span></p>
                <p class="text-xs text-slate-400" data-i18n="brand.tagline"></p>
            </div>
        </button>
        <div class="hidden items-center gap-2 md:flex">
            <button class="rounded-xl px-4 py-2 text-sm hover:bg-white/10" onclick="showPage('home')" data-i18n="nav.home"></button>
            <button class="rounded-xl px-4 py-2 text-sm hover:bg-white/10" onclick="showPage('tours')" data-i18n="nav.tours"></button>
            <button id="myBookingsLink" class="hidden rounded-xl px-4 py-2 text-sm hover:bg-white/10" onclick="requireAuth(()=>showPage('mybookings'))" data-i18n="nav.bookings"></button>
        </div>
        <div class="flex items-center gap-2">
            <select id="langSwitcher" class="glass rounded-xl px-2 py-2 text-sm" onchange="switchLanguage(this.value)">
                <option value="en">EN</option><option value="vi">VI</option>
                <option value="zh">中文</option><option value="ko">한국어</option><option value="ja">日本語</option>
            </select>
            <button class="glass h-10 w-10 rounded-xl" onclick="toggleTheme()" aria-label="theme">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
            <div id="guestActions">
                <button class="glass rounded-xl px-4 py-2 text-sm font-semibold" onclick="showPage('auth')" data-i18n="auth.login"></button>
            </div>
            <div id="userMenu" class="relative hidden">
                <button class="glass rounded-xl px-4 py-2 text-sm" onclick="toggleDropdown()">
                    <span id="userDisplayName"></span> <i class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="userDropdown" class="glass absolute right-0 mt-2 hidden w-56 rounded-xl p-2 shadow-xl">
                    <button class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-white/10" onclick="showPage('mybookings');closeDropdown()" data-i18n="nav.bookings"></button>
                    <button class="block w-full rounded-lg px-3 py-2 text-left text-sm text-rose-300 hover:bg-rose-500/10" onclick="logout()" data-i18n="auth.logout"></button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Pages -->
<main>
    <!-- HOME -->
    <section id="page-home" class="page active">
        <div class="mx-auto max-w-7xl px-4 pb-10 pt-8 md:px-8">
            <!-- Hero -->
            <div class="glass relative overflow-hidden rounded-3xl p-6 md:p-10">
                <img src="https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=2000&q=80"
                     class="absolute inset-0 h-full w-full object-cover" alt="Ha Long Bay" />
                <div class="absolute inset-0 bg-gradient-to-br from-slate-900/80 via-slate-800/70 to-cyan-900/65"></div>
                <div class="relative max-w-4xl">
                    <span class="inline-flex rounded-full border border-cyan-300/35 bg-cyan-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-wider text-cyan-200" data-i18n="hero.badge"></span>
                    <h1 class="mt-4 text-4xl font-black leading-tight md:text-6xl" data-i18n="hero.title"></h1>
                    <p class="mt-4 text-slate-100 md:text-lg" data-i18n="hero.subtitle"></p>
                    <div class="glass mt-7 grid gap-3 rounded-2xl p-4 md:grid-cols-[1.2fr,1fr,1fr,auto]">
                        <input id="heroSearch" class="rounded-xl border border-white/15 bg-white/10 px-4 py-3 text-sm" data-i18n-placeholder="hero.search" />
                        <select id="heroDestination" class="rounded-xl border border-white/15 px-4 py-3 text-sm"></select>
                        <select id="heroPrice" class="rounded-xl border border-white/15 px-4 py-3 text-sm"></select>
                        <button class="rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 px-6 py-3 font-bold text-slate-900 transition hover:scale-[1.02]" onclick="applyHeroSearch()">
                            <i class="fa-solid fa-magnifying-glass mr-2"></i><span data-i18n="hero.cta"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Promo + Checkin -->
            <div class="mt-6 grid gap-6 md:grid-cols-3">
                <section class="glass rounded-3xl p-6 md:col-span-2">
                    <div class="mb-4 flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold" data-i18n="promo.title"></h2>
                            <p class="text-slate-300" data-i18n="promo.subtitle"></p>
                        </div>
                        <span class="rounded-full bg-rose-500/20 px-3 py-1 text-xs font-semibold text-rose-300 animate-pulseSoft" data-i18n="promo.flash"></span>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-center">
                        <div class="rounded-xl bg-white/10 p-3">
                            <div id="cdDays"  class="text-2xl font-black text-cyan-300">00</div>
                            <div class="text-xs text-slate-300" data-i18n="time.days"></div>
                        </div>
                        <div class="rounded-xl bg-white/10 p-3">
                            <div id="cdHours" class="text-2xl font-black text-cyan-300">00</div>
                            <div class="text-xs text-slate-300" data-i18n="time.hours"></div>
                        </div>
                        <div class="rounded-xl bg-white/10 p-3">
                            <div id="cdMins"  class="text-2xl font-black text-cyan-300">00</div>
                            <div class="text-xs text-slate-300" data-i18n="time.mins"></div>
                        </div>
                        <div class="rounded-xl bg-white/10 p-3">
                            <div id="cdSecs"  class="text-2xl font-black text-cyan-300">00</div>
                            <div class="text-xs text-slate-300" data-i18n="time.secs"></div>
                        </div>
                    </div>
                </section>

                <!-- Daily Check-in Card -->
                <section class="glass rounded-3xl p-6 flex flex-col gap-3">

                    <!-- Header: title + tier badge -->
                    <div class="flex items-center justify-between">
                        <h3 class="text-xl font-bold" data-i18n="checkin.title"></h3>
                        <span id="tierBadge" class="hidden rounded-full border px-2.5 py-0.5 text-xs font-semibold"></span>
                    </div>

                    <!-- Streak + Points row -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="rounded-xl bg-white/10 p-3 text-center">
                            <div id="streakValue" class="text-2xl font-black text-emerald-300">0</div>
                            <div class="text-xs text-slate-400 mt-0.5 flex items-center justify-center gap-1">
                                <i class="fa-solid fa-fire text-orange-400"></i>
                                <span data-i18n="checkin.streak"></span>
                            </div>
                        </div>
                        <div class="rounded-xl bg-white/10 p-3 text-center">
                            <div id="pointsValue" class="text-2xl font-black text-cyan-300">0</div>
                            <div class="text-xs text-slate-400 mt-0.5 flex items-center justify-center gap-1">
                                <i class="fa-solid fa-star text-amber-400"></i>
                                <span data-i18n="points.current"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Check-in button -->
                    <button id="checkinBtn"
                            class="mt-auto w-full rounded-xl bg-gradient-to-r from-indigo-400 to-cyan-400 py-2.5 font-semibold text-slate-900 transition hover:scale-[1.02] active:scale-[0.98]"
                            onclick="dailyCheckin()">
                        <i class="fa-solid fa-calendar-check mr-2"></i>
                        <span data-i18n="checkin.button"></span>
                    </button>

                    <!-- Login hint -->
                    <p id="checkinLoginHint" class="hidden text-center text-xs text-slate-500">
                        <a class="text-cyan-400 cursor-pointer hover:underline" onclick="showPage('auth')">Đăng nhập</a>
                        để tích điểm & check-in hàng ngày
                    </p>

                </section>
            </div>

            <!-- Featured + Vouchers -->
            <div class="mt-6 grid gap-6 md:grid-cols-3">
                <section class="glass rounded-3xl p-6 md:col-span-2">
                    <div class="mb-4 flex items-center justify-between">
                        <h3 class="text-2xl font-bold" data-i18n="featured.title"></h3>
                        <div class="flex gap-2">
                            <button class="glass h-9 w-9 rounded-lg" onclick="slideFeatured(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                            <button class="glass h-9 w-9 rounded-lg" onclick="slideFeatured(1)"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div id="featuredCarousel" class="grid gap-4 md:grid-cols-3"></div>
                </section>
                <section class="glass rounded-3xl p-6 flex flex-col gap-3">
                    <h3 class="text-xl font-bold" data-i18n="voucher.title"></h3>

                    <!-- Danh sách voucher -->
                    <div id="voucherList" class="space-y-2 flex-1"></div>

                    <!-- Nhập mã voucher -->
                    <div class="mt-2 flex gap-2">
                        <input id="voucherInput"
                               class="w-full rounded-xl border border-white/10 bg-white/10 px-3 py-2 text-sm uppercase placeholder:normal-case placeholder:text-slate-500 focus:border-amber-400 focus:outline-none transition"
                               data-i18n-placeholder="voucher.placeholder"
                               maxlength="20" />
                        <button class="rounded-xl bg-cyan-400 px-4 py-2 font-semibold text-slate-900 transition hover:bg-cyan-300"
                                onclick="applyVoucher()"
                                data-i18n="voucher.apply"></button>
                    </div>

                    <!-- Đổi điểm lấy voucher -->
                    <button
                            class="flex items-center justify-between rounded-xl border border-dashed border-emerald-500/40 bg-emerald-500/5 px-4 py-2.5 text-sm transition hover:bg-emerald-500/10"
                            onclick="redeemPoints()">
                        <span class="font-semibold text-emerald-300" data-i18n="voucher.redeem"></span>
                        <span class="rounded-full bg-emerald-500/20 px-2 py-0.5 text-xs font-bold text-emerald-300">300 pts → -10%</span>
                    </button>
                </section>
            </div>

            <!-- Recommended + Stats -->
            <div class="mt-6 grid gap-6 md:grid-cols-2">
                <section class="glass rounded-3xl p-6">
                    <h3 class="text-xl font-bold" data-i18n="recommend.title"></h3>
                    <div id="recommendedGrid" class="mt-4 grid gap-4 md:grid-cols-2"></div>
                </section>
                <section class="glass rounded-3xl p-6">
                    <h3 class="text-xl font-bold" data-i18n="stats.title"></h3>
                    <div class="mt-4 grid grid-cols-3 gap-3 text-center">
                        <div class="rounded-xl bg-white/10 p-3"><div id="statUsers" class="text-2xl font-black text-cyan-300">0</div><div class="text-xs text-slate-300" data-i18n="stats.users"></div></div>
                        <div class="rounded-xl bg-white/10 p-3"><div id="statTours" class="text-2xl font-black text-emerald-300">0</div><div class="text-xs text-slate-300" data-i18n="stats.tours"></div></div>
                        <div class="rounded-xl bg-white/10 p-3"><div id="statRate"  class="text-2xl font-black text-indigo-300">0</div><div class="text-xs text-slate-300" data-i18n="stats.rating"></div></div>
                    </div>
                </section>
            </div>

            <!-- Featured Reviews  -->
            <div class="mt-6">
                <section class="glass rounded-3xl p-6">
                    <div class="mb-4 flex items-center justify-between">
                        <div>
                            <h3 class="text-2xl font-bold" data-i18n="reviews.title"></h3>
                            <p class="text-slate-300" data-i18n="reviews.subtitle"></p>
                        </div>
                    </div>
                    <div id="featuredReviews" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
                </section>
            </div>
        </div>
    </section>

    <!-- TOURS LIST -->
    <section id="page-tours" class="page">
        <div class="mx-auto max-w-7xl px-4 py-10 md:px-8">
            <div class="glass rounded-2xl p-6">
                <!-- Filter bar -->
                <div class="mb-6 flex flex-wrap items-center gap-3">
                    <input id="tourSearchInput" oninput="filterTours()" class="rounded-xl border border-white/10 bg-white/10 px-3 py-2 text-sm" data-i18n-placeholder="hero.search" />
                    <select id="destinationFilter" onchange="filterTours()" class="rounded-xl border border-white/10 bg-slate-800/80 px-3 py-2 text-sm"></select>
                    <select id="priceFilter" onchange="filterTours()" class="rounded-xl border border-white/10 bg-slate-800/80 px-3 py-2 text-sm"></select>
                    <select id="ratingFilter" onchange="filterTours()" class="rounded-xl border border-white/10 bg-slate-800/80 px-3 py-2 text-sm"></select>
                    <select id="sortFilter" onchange="filterTours()" class="rounded-xl border border-white/10 bg-slate-800/80 px-3 py-2 text-sm"></select>
                </div>
                <div id="allTourGrid" class="grid grid-cols-1 gap-4 md:grid-cols-3"></div>
                <div id="pagination" class="mt-6 flex justify-center gap-2"></div>
            </div>
        </div>
    </section>

    <!-- TOUR DETAIL -->
    <section id="page-detail" class="page">
        <div class="mx-auto max-w-7xl px-4 py-8 md:px-8">
            <button onclick="showPage('tours')" class="mb-6 flex items-center gap-2 text-sm text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left"></i> <span>Quay lại danh sách</span>
            </button>
            <div id="detailGrid" class="grid gap-6 lg:grid-cols-[1fr,400px]"></div>
            <!-- Reviews section below detail -->
            <div id="tourReviewsSection" class="mt-8"></div>
        </div>
    </section>

    <!-- MY BOOKINGS -->
    <section id="page-mybookings" class="page">
        <div class="mx-auto max-w-7xl px-4 py-10 md:px-8">
            <div class="glass mb-6 rounded-3xl p-6">
                <h2 class="text-3xl font-black" data-i18n="nav.bookings"></h2>
            </div>
            <div id="bookingsList" class="space-y-4"></div>
        </div>
    </section>

    <!-- AUTH -->
    <section id="page-auth" class="page">
        <div class="mx-auto max-w-7xl px-4 py-10 md:px-8">
            <div class="mx-auto max-w-md">
                <div class="glass rounded-3xl p-8">
                    <div class="mb-6 flex rounded-2xl bg-white/5 p-1">
                        <button id="loginTab"    onclick="switchAuthTab('login')"    class="flex-1 rounded-xl py-2.5 text-sm font-semibold transition-all" data-i18n="auth.login"></button>
                        <button id="registerTab" onclick="switchAuthTab('register')" class="flex-1 rounded-xl py-2.5 text-sm font-semibold transition-all" data-i18n="auth.registerBtn"></button>
                    </div>
                    <div id="loginForm">
                        <div class="space-y-4">
                            <input id="loginEmail"    type="email"    class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm" data-i18n-placeholder="auth.email" />
                            <input id="loginPassword" type="password" class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm" data-i18n-placeholder="auth.password" />
                            <button id="loginBtn" onclick="doLogin()" class="w-full rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 py-3 font-bold text-slate-900" data-i18n="auth.login"></button>
                        </div>
                    </div>
                    <div id="registerForm" class="hidden">
                        <div class="space-y-4">
                            <input id="regName"     class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm" data-i18n-placeholder="auth.fullName" />
                            <input id="regEmail"    type="email"    class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm" data-i18n-placeholder="auth.email" />
                            <input id="regPassword" type="password" class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-3 text-sm" data-i18n-placeholder="auth.password" />
                            <button id="registerBtn" onclick="doRegister()" class="w-full rounded-xl bg-gradient-to-r from-violet-400 to-indigo-400 py-3 font-bold text-slate-900" data-i18n="auth.registerBtn"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="border-t border-white/10">
    <div class="mx-auto max-w-7xl px-4 py-10 text-sm text-slate-400 md:px-8" data-i18n="footer.copy"></div>
</footer>

<!-- Chatbot toggle button -->
<button id="chatToggleBtn" onclick="toggleChatbot()"
        style="position:fixed;bottom:24px;right:24px;z-index:50;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#10b981);border:none;cursor:pointer;box-shadow:0 8px 24px rgba(34,211,238,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;"
        onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 12px 32px rgba(34,211,238,.55)'"
        onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 8px 24px rgba(34,211,238,.4)'">
    <svg id="chatIconOpen"  width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <svg id="chatIconClose" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" style="display:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    <span id="chatBadge" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#f43f5e;font-size:10px;font-weight:700;color:#fff;display:none;align-items:center;justify-content:center;border:2px solid #0f172a;">1</span>
</button>

<!-- Chat panel -->
<div id="chatPanel" style="position:fixed;bottom:92px;right:24px;z-index:50;width:min(380px,calc(100vw - 32px));border-radius:20px;background:rgba(15,23,42,0.97);border:1px solid rgba(148,163,184,0.18);backdrop-filter:blur(20px);box-shadow:0 24px 64px rgba(0,0,0,.55);display:none;flex-direction:column;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;transition:opacity .25s,transform .25s;opacity:0;transform:translateY(12px) scale(.97);">
    <div style="padding:14px 16px 12px;background:linear-gradient(135deg,rgba(14,116,144,.35),rgba(5,150,105,.2));border-bottom:1px solid rgba(148,163,184,.12);display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#10b981);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;">✦</div>
        <div style="flex:1">
            <div style="font-size:14px;font-weight:700;color:#e2e8f0;">SmartTravel AI</div>
            <div style="font-size:11px;color:#34d399;display:flex;align-items:center;gap:4px;"><span style="width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block;"></span> Trực tuyến · Phản hồi ngay</div>
        </div>
        <button onclick="clearChat()" title="Xóa lịch sử" style="background:rgba(255,255,255,.06);border:none;cursor:pointer;border-radius:8px;padding:6px 8px;color:#94a3b8;font-size:11px;">🗑</button>
        <button onclick="toggleChatbot()" style="background:rgba(255,255,255,.06);border:none;cursor:pointer;border-radius:8px;padding:6px 10px;color:#94a3b8;font-size:14px;">✕</button>
    </div>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

<script src="/js/i18n.js"></script>

<script src="/js/reviews.js"></script>

<!--App bootstrap-->
<script>
    const stickyBookingBtn = document.getElementById("mobileStickyBookBtn");
    const streakEl  = document.getElementById("streakValue");

    function showPage(name) {
        document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
        document.getElementById("page-" + name)?.classList.add("active");
        if (name === "home")       loadHomeData();
        if (name === "tours")      loadAllTours();
        if (name === "mybookings") loadMyBookings();
        if (stickyBookingBtn) stickyBookingBtn.classList.add("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function requireAuth(callback) {
        if (!getToken()) { toast(t("toast.loginFirst"), "error"); showPage("auth"); return; }
        callback?.();
    }

    // Bootstrap
    initTheme();
    initNavbarScroll();
    updateNavAuth();
    switchAuthTab("login");
    initCountdown();

    const checkinHint = document.getElementById("checkinLoginHint");
    if (checkinHint) {
        if (!getToken()) {
            checkinHint.classList.remove("hidden");
            const checkinBtn = document.getElementById("checkinBtn");
            if (checkinBtn) checkinBtn.classList.add("hidden");
        }
    }

    if (document.getElementById("langSwitcher")) {
        document.getElementById("langSwitcher").value = currentLang;
    }
    switchLanguage(currentLang);

    // Xử lý kết quả redirect từ MoMo
    (function handlePaymentReturn() {
        const params      = new URLSearchParams(window.location.search);
        const payment     = params.get("payment");
        const code        = params.get("code");
        const page        = params.get("page");

        if (!payment && !page) return;

        window.history.replaceState({}, document.title, "/");

        if (payment === "success") {
            setTimeout(() => {
                toast(`Thanh toán thành công! Mã đơn: ${code}`, "success");
                showPage("mybookings");
            }, 500);
        } else if (payment === "failed") {
            setTimeout(() => {
                toast(`❌ Thanh toán thất bại! Mã đơn: ${code}`, "error");
                showPage("mybookings");
            }, 500);
        } else if (page === "mybookings") {
            setTimeout(() => showPage("mybookings"), 300);
        }
    })();

    showPage("home");
</script>
</body>
</html>
