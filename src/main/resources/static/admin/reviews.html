<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews Management - SmartTravel Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"],
                    },
                }
            }
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dark font-sans antialiased bg-slate-900">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-800/95 backdrop-blur-xl border-r border-white/10 z-40">
        <div class="flex h-20 items-center justify-center border-b border-white/10">
            <div class="text-center">
                <p class="text-xl font-black tracking-tight"><span class="text-cyan-300">Smart</span><span>Travel</span></p>
                <p class="text-xs text-slate-400">Admin Panel</p>
            </div>
        </div>

        <nav class="p-4 space-y-2">
            <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-chart-line w-5"></i>
                <span class="font-semibold">Dashboard</span>
            </a>
            <a href="users.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-users w-5"></i>
                <span class="font-semibold">Users</span>
            </a>
            <a href="bookings.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-ticket w-5"></i>
                <span class="font-semibold">Bookings</span>
            </a>
            <a href="reviews.html" class="flex items-center gap-3 rounded-xl px-4 py-3 bg-cyan-500/20 text-cyan-300">
                <i class="fa-solid fa-star w-5"></i>
                <span class="font-semibold">Reviews</span>
            </a>
            <a href="../index.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition mt-6">
                <i class="fa-solid fa-arrow-left w-5"></i>
                <span class="font-semibold">Back to Site</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8">
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-black">Reviews Management</h1>
                <p class="text-slate-400 mt-1">Manage traveler reviews and ratings</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="glass rounded-xl px-4 py-2 text-sm">
                    <i class="fa-solid fa-user-circle mr-2"></i>
                    Admin
                </div>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="grid gap-4 md:grid-cols-4 mb-6">
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">Total Reviews</p>
                <p id="totalReviews" class="text-2xl font-bold text-cyan-300">0</p>
            </div>
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">Average Rating</p>
                <p id="avgRating" class="text-2xl font-bold text-amber-300">0.0</p>
            </div>
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">5-Star Reviews</p>
                <p id="fiveStarReviews" class="text-2xl font-bold text-emerald-300">0</p>
            </div>
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">This Month</p>
                <p id="monthlyReviews" class="text-2xl font-bold text-indigo-300">0</p>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="glass rounded-2xl p-4 mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex-1 min-w-[200px]">
                    <input id="reviewSearchInput" type="text" placeholder="Search by user, tour, or content..."
                           class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" oninput="filterReviews()" />
                </div>
                <select id="ratingFilter" class="rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" onchange="filterReviews()">
                    <option value="">All Ratings</option>
                    <option value="5">5 Stars</option>
                    <option value="4">4+ Stars</option>
                    <option value="3">3+ Stars</option>
                    <option value="2">2+ Stars</option>
                    <option value="1">1+ Stars</option>
                </select>
            </div>
        </div>

        <!-- Reviews Grid -->
        <div id="reviewsGrid" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Loading reviews...</p>
            </div>
        </div>

        <div id="pagination" class="mt-6 flex justify-center gap-2"></div>
    </main>
</div>

<!-- View Review Modal -->
<div id="viewReviewModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-900/60 p-4">
    <div class="glass w-full max-w-lg rounded-2xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h4 class="text-xl font-bold">Review Details</h4>
            <button onclick="closeViewModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="reviewDetails" class="space-y-3"></div>
        <div class="mt-6 pt-4 border-t border-white/10 flex gap-3">
            <button onclick="deleteCurrentReview()" class="flex-1 rounded-xl bg-rose-500/20 text-rose-400 py-2 hover:bg-rose-500/30">
                Delete Review
            </button>
            <button onclick="closeViewModal()" class="flex-1 rounded-xl bg-white/10 py-2 hover:bg-white/20">
                Close
            </button>
        </div>
    </div>
</div>

<script>

    // Auth guard
    (function() {
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("adminRole");
        if (!token || role !== "ADMIN") {
            window.location.replace("/admin/login.html");
            document.documentElement.style.display = "none";
            throw new Error("Not authenticated");
        }
    })();
    const API = "/api";
    let allReviews = [];
    let filteredReviews = [];
    let currentPage = 1;
    const PAGE_SIZE = 9;
    let currentReviewId = null;

    async function api(path, opts = {}) {
        try {
            const token = localStorage.getItem("adminToken");
            if (!token) { window.location.href = "/admin/login.html"; return { success: false, data: null }; }
            opts.headers = { ...(opts.headers || {}), "Authorization": "Bearer " + token };
            const response = await fetch(API + path, opts);
            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem("adminToken");
                window.location.href = "/admin/login.html";
                return { success: false, data: null };
            }
            const data = await response.json();
            return data;
        } catch (e) {
            return { success: false, data: null };
        }
    }

    function getAvatarUrl(name, email) {
        const seed = encodeURIComponent(email || name || "user");
        return `https://api.dicebear.com/7.x/initials/svg?seed=${seed}&backgroundColor=22d3ee,10b981,a855f7,ec4899,6366f1&backgroundType=gradientLinear`;
    }

    function formatDate(dateStr) {
        if (!dateStr) return "-";
        return new Date(dateStr).toLocaleDateString("vi-VN", { day: "numeric", month: "short", year: "numeric" });
    }

    function getStarRatingHtml(rating) {
        const stars = Math.round(parseFloat(rating) || 0);
        let html = "";
        for (let i = 1; i <= 5; i++) {
            html += i <= stars ? '<span class="text-amber-400">★</span>' : '<span class="text-slate-600">★</span>';
        }
        return html;
    }

    function renderReviewCard(review) {
        const avatarUrl = getAvatarUrl(review.userName, review.userEmail);
        return `
    <article class="glass rounded-2xl p-5 hover:bg-white/10 transition cursor-pointer" onclick="viewReview(${review.id})">
        <div class="flex items-start gap-4">
            <img src="${avatarUrl}" alt="${review.userName}" class="h-12 w-12 rounded-full" />
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                    <h4 class="font-bold truncate">${review.userName}</h4>
                    <span class="text-xs text-slate-500">${formatDate(review.createdAt)}</span>
                </div>
                <div class="mt-1 flex items-center gap-2">
                    ${getStarRatingHtml(review.rating)}
                    <span class="text-xs text-slate-400">${review.rating}/5</span>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <p class="text-xs text-cyan-400 mb-1">${review.tourName || "Tour"}</p>
            <h5 class="font-semibold text-cyan-200 line-clamp-1">${review.title}</h5>
            <p class="mt-2 text-sm text-slate-300 line-clamp-3">${review.body}</p>
        </div>
        <div class="mt-3 flex items-center justify-between text-xs text-slate-500">
            <span>${review.helpfulCount || 0} found helpful</span>
        </div>
    </article>`;
    }

    function renderReviewsGrid(reviews) {
        const container = document.getElementById("reviewsGrid");
        if (!reviews || reviews.length === 0) {
            container.innerHTML = `
        <div class="col-span-full glass rounded-2xl p-12 text-center text-slate-400">
            <i class="fa-solid fa-star text-4xl mb-3"></i>
            <p>No reviews found</p>
        </div>`;
            return;
        }

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageReviews = reviews.slice(start, start + PAGE_SIZE);
        container.innerHTML = pageReviews.map(renderReviewCard).join("");
        renderPagination(reviews.length);
    }

    function renderPagination(total) {
        const totalPages = Math.ceil(total / PAGE_SIZE);
        const container = document.getElementById("pagination");
        if (totalPages <= 1) {
            container.innerHTML = "";
            return;
        }

        container.innerHTML = new Array(totalPages).fill(0).map((_, i) =>
            `<button class="${currentPage === i + 1 ? 'bg-cyan-400 text-slate-900' : 'glass'} h-9 w-9 rounded-lg"
            onclick="goToPage(${i + 1})">${i + 1}</button>`
        ).join("");
    }

    function goToPage(page) {
        currentPage = page;
        renderReviewsGrid(filteredReviews);
    }

    function filterReviews() {
        const q = document.getElementById("reviewSearchInput").value.toLowerCase();
        const rating = document.getElementById("ratingFilter").value;

        filteredReviews = allReviews.filter(r => {
            const matchText = !q ||
                (r.userName || "").toLowerCase().includes(q) ||
                (r.tourName || "").toLowerCase().includes(q) ||
                (r.title || "").toLowerCase().includes(q) ||
                (r.body || "").toLowerCase().includes(q);
            const matchRating = !rating || (r.rating || 0) >= parseInt(rating);
            return matchText && matchRating;
        });

        currentPage = 1;
        renderReviewsGrid(filteredReviews);
    }

    async function loadReviews() {
        const data = await api("/reviews");
        if (data.success && data.data) {
            allReviews = data.data;
            filteredReviews = [...allReviews];
            renderReviewsGrid(filteredReviews);
            updateStats();
        }
    }

    function updateStats() {
        const total = allReviews.length;
        let sumRating = 0;
        let fiveStar = 0;
        let thisMonth = new Date().getMonth();

        allReviews.forEach(r => {
            sumRating += r.rating || 0;
            if (r.rating === 5) fiveStar++;
            const reviewDate = new Date(r.createdAt);
            if (reviewDate.getMonth() === thisMonth) thisMonth++;
        });

        const avg = total > 0 ? (sumRating / total).toFixed(1) : "0.0";

        document.getElementById("totalReviews").textContent = total;
        document.getElementById("avgRating").textContent = avg;
        document.getElementById("fiveStarReviews").textContent = fiveStar;
        document.getElementById("monthlyReviews").textContent = thisMonth;
    }

    function viewReview(id) {
        const review = allReviews.find(r => r.id === id);
        if (!review) return;

        currentReviewId = id;
        const avatarUrl = getAvatarUrl(review.userName, review.userEmail);

        document.getElementById("reviewDetails").innerHTML = `
        <div class="flex items-center gap-4 p-4 bg-white/5 rounded-xl">
            <img src="${avatarUrl}" alt="${review.userName}" class="h-14 w-14 rounded-full" />
            <div>
                <h4 class="font-bold text-lg">${review.userName}</h4>
                <p class="text-sm text-slate-400">${review.userEmail}</p>
                <div class="mt-1">${getStarRatingHtml(review.rating)} <span class="text-xs text-slate-400">${review.rating}/5</span></div>
            </div>
        </div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">Tour</span><span>${review.tourName}</span></div>
        <div class="flex justify-between text-sm"><span class="text-slate-400">Date</span><span>${formatDate(review.createdAt)}</span></div>
        <div class="mt-3">
            <h5 class="font-semibold text-cyan-200">${review.title}</h5>
            <p class="mt-2 text-slate-300">${review.body}</p>
        </div>
        <div class="mt-3 text-sm text-slate-400">${review.helpfulCount || 0} people found this helpful</div>
    `;

        document.getElementById("viewReviewModal").classList.remove("hidden");
        document.getElementById("viewReviewModal").classList.add("flex");
    }

    function closeViewModal() {
        document.getElementById("viewReviewModal").classList.add("hidden");
        document.getElementById("viewReviewModal").classList.remove("flex");
        currentReviewId = null;
    }

    async function deleteCurrentReview() {
        if (!currentReviewId || !confirm("Are you sure you want to delete this review?")) return;

        const data = await api(`/reviews/${currentReviewId}`, { method: "DELETE" });
        if (data.success) {
            closeViewModal();
            loadReviews();
        } else {
            alert(data.message || "Failed to delete review");
        }
    }

    document.addEventListener("DOMContentLoaded", loadReviews);
</script>
</body>
</html>
