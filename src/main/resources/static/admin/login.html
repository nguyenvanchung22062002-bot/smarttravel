<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login – SmartTravel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center">
<div class="w-full max-w-md p-8 rounded-2xl bg-white/5 border border-white/10 shadow-2xl">
    <div class="flex flex-col items-center mb-8">
        <div class="h-14 w-14 rounded-2xl bg-cyan-500/20 flex items-center justify-center mb-4">
            <i class="fa-solid fa-shield-halved text-cyan-400 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Admin Login</h1>
        <p class="text-slate-400 text-sm mt-1">SmartTravel Management</p>
    </div>

    <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-rose-500/20 text-rose-400 text-sm text-center"></div>

    <div class="space-y-4">
        <div>
            <label class="block text-sm text-slate-300 mb-1">Email</label>
            <input id="email" type="email" placeholder="admin@smarttravel.com"
                   class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400" />
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-1">Mật khẩu</label>
            <input id="password" type="password" placeholder="••••••••"
                   class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                   onkeydown="if(event.key==='Enter') doLogin()" />
        </div>
        <button onclick="doLogin()" id="loginBtn"
                class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white font-semibold transition">
            Đăng nhập
        </button>
    </div>
</div>

<script>
    async function doLogin() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const errEl = document.getElementById("errorMsg");
        const btn = document.getElementById("loginBtn");

        errEl.classList.add("hidden");
        btn.disabled = true;
        btn.textContent = "Đang đăng nhập...";

        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (data.success && data.data?.role === "ADMIN") {
                localStorage.setItem("adminToken", data.data.token);
                localStorage.setItem("adminRole", data.data.role);
                localStorage.setItem("adminName", data.data.fullName);
                // Small delay to ensure localStorage is committed before redirect
                setTimeout(() => { window.location.replace("/admin/dashboard.html"); }, 50);
            } else if (data.success && data.data?.role !== "ADMIN") {
                errEl.textContent = "Tài khoản không có quyền Admin!";
                errEl.classList.remove("hidden");
            } else {
                errEl.textContent = data.message || "Email hoặc mật khẩu không đúng!";
                errEl.classList.remove("hidden");
            }
        } catch (e) {
            errEl.textContent = "Không thể kết nối đến server!";
            errEl.classList.remove("hidden");
        }

        btn.disabled = false;
        btn.textContent = "Đăng nhập";
    }
</script>
</body>
</html>
