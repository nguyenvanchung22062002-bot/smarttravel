<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings Management - SmartTravel Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"],
                    },
                }
            }
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dark font-sans antialiased bg-slate-900">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-800/95 backdrop-blur-xl border-r border-white/10 z-40">
        <div class="flex h-20 items-center justify-center border-b border-white/10">
            <div class="text-center">
                <p class="text-xl font-black tracking-tight"><span class="text-cyan-300">Smart</span><span>Travel</span></p>
                <p class="text-xs text-slate-400">Admin Panel</p>
            </div>
        </div>

        <nav class="p-4 space-y-2">
            <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-chart-line w-5"></i>
                <span class="font-semibold">Dashboard</span>
            </a>
            <a href="users.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-users w-5"></i>
                <span class="font-semibold">Users</span>
            </a>
            <a href="bookings.html" class="flex items-center gap-3 rounded-xl px-4 py-3 bg-cyan-500/20 text-cyan-300">
                <i class="fa-solid fa-ticket w-5"></i>
                <span class="font-semibold">Bookings</span>
            </a>
            <a href="reviews.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-star w-5"></i>
                <span class="font-semibold">Reviews</span>
            </a>
            <a href="../index.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition mt-6">
                <i class="fa-solid fa-arrow-left w-5"></i>
                <span class="font-semibold">Back to Site</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8">
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-black">Bookings Management</h1>
                <p class="text-slate-400 mt-1">View and manage all tour bookings</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="glass rounded-xl px-4 py-2 text-sm">
                    <i class="fa-solid fa-user-circle mr-2"></i>
                    Admin
                </div>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="grid gap-4 md:grid-cols-4 mb-6">
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">Total Bookings</p>
                <p id="totalBookings" class="text-2xl font-bold text-cyan-300">0</p>
            </div>
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">Pending</p>
                <p id="pendingBookings" class="text-2xl font-bold text-amber-300">0</p>
            </div>
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">Confirmed</p>
                <p id="confirmedBookings" class="text-2xl font-bold text-emerald-300">0</p>
            </div>
            <div class="glass rounded-xl p-4">
                <p class="text-sm text-slate-400">Completed</p>
                <p id="completedBookings" class="text-2xl font-bold text-indigo-300">0</p>
            </div>
        </div>

        <!-- Search & Filter -->
        <div class="glass rounded-2xl p-4 mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex-1 min-w-[200px]">
                    <input id="bookingSearchInput" type="text" placeholder="Search by code or tour name..."
                           class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" oninput="filterBookings()" />
                </div>
                <select id="statusFilter" class="rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" onchange="filterBookings()">
                    <option value="">All Status</option>
                    <option value="PENDING">Pending</option>
                    <option value="CONFIRMED">Confirmed</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
        </div>

        <!-- Bookings Table -->
        <div class="glass rounded-2xl overflow-hidden">
            <table class="w-full">
                <thead class="border-b border-white/10">
                <tr class="text-left text-sm text-slate-400">
                    <th class="p-4 font-medium">Booking Code</th>
                    <th class="p-4 font-medium">User</th>
                    <th class="p-4 font-medium">Tour</th>
                    <th class="p-4 font-medium">Departure</th>
                    <th class="p-4 font-medium">Amount</th>
                    <th class="p-4 font-medium">Status</th>
                    <th class="p-4 font-medium">Actions</th>
                </tr>
                </thead>
                <tbody id="bookingsTableBody">
                <tr>
                    <td colspan="7" class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                        <p>Loading bookings...</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div id="pagination" class="mt-4 flex justify-center gap-2"></div>
    </main>
</div>

<!-- View Booking Modal -->
<div id="viewBookingModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-900/60 p-4">
    <div class="glass w-full max-w-lg rounded-2xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h4 class="text-xl font-bold">Booking Details</h4>
            <button onclick="closeViewModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="bookingDetails" class="space-y-3 text-sm"></div>
        <div class="mt-6 pt-4 border-t border-white/10 flex gap-3">
            <button id="confirmBtn" onclick="updateStatus('CONFIRMED')" class="flex-1 rounded-xl bg-emerald-500/20 text-emerald-400 py-2 hover:bg-emerald-500/30">
                Confirm
            </button>
            <button id="completeBtn" onclick="updateStatus('COMPLETED')" class="flex-1 rounded-xl bg-indigo-500/20 text-indigo-400 py-2 hover:bg-indigo-500/30">
                Complete
            </button>
            <button id="cancelBtn" onclick="updateStatus('CANCELLED')" class="flex-1 rounded-xl bg-rose-500/20 text-rose-400 py-2 hover:bg-rose-500/30">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>

    // Auth guard
    (function() {
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("adminRole");
        if (!token || role !== "ADMIN") {
            window.location.replace("/admin/login.html");
            document.documentElement.style.display = "none";
            throw new Error("Not authenticated");
        }
    })();
    const API = "/api";
    let allBookings = [];
    let filteredBookings = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;
    let currentBookingId = null;

    async function api(path, opts = {}) {
        try {
            const token = localStorage.getItem("adminToken");
            if (!token) { window.location.href = "/admin/login.html"; return { success: false, data: null }; }
            opts.headers = { ...(opts.headers || {}), "Authorization": "Bearer " + token };
            const response = await fetch(API + path, opts);
            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem("adminToken");
                window.location.href = "/admin/login.html";
                return { success: false, data: null };
            }
            const data = await response.json();
            return data;
        } catch (e) {
            return { success: false, data: null };
        }
    }

    function fmtPrice(v) {
        return Number(v || 0).toLocaleString("vi-VN") + "₫";
    }

    function formatDate(dateStr) {
        if (!dateStr) return "-";
        return new Date(dateStr).toLocaleDateString("vi-VN", { day: "numeric", month: "short", year: "numeric" });
    }

    function getStatusBadge(status) {
        const styles = {
            "PENDING": "bg-amber-500/20 text-amber-400",
            "CONFIRMED": "bg-emerald-500/20 text-emerald-400",
            "COMPLETED": "bg-indigo-500/20 text-indigo-400",
            "CANCELLED": "bg-rose-500/20 text-rose-400"
        };
        return `<span class="px-2 py-1 rounded-full text-xs ${styles[status] || styles.PENDING}">${status}</span>`;
    }

    function renderBookingsTable(bookings) {
        const tbody = document.getElementById("bookingsTableBody");
        if (!bookings || bookings.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">No bookings found</td></tr>`;
            return;
        }

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageBookings = bookings.slice(start, start + PAGE_SIZE);

        tbody.innerHTML = pageBookings.map(b => `
        <tr class="border-b border-white/5 hover:bg-white/5 transition">
            <td class="p-4">
                <span class="font-mono font-semibold">${b.bookingCode || "-"}</span>
            </td>
            <td class="p-4 text-slate-300">${b.userName || "-"}</td>
            <td class="p-4 text-slate-300">${b.tourName || "-"}</td>
            <td class="p-4 text-slate-300">${formatDate(b.departureDate)}</td>
            <td class="p-4 font-bold text-cyan-300">${fmtPrice(b.totalPrice)}</td>
            <td class="p-4">${getStatusBadge(b.status)}</td>
            <td class="p-4">
                <button onclick="viewBooking(${b.id})" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-slate-300" title="View Details">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </td>
        </tr>
    `).join("");

        renderPagination(bookings.length);
    }

    function renderPagination(total) {
        const totalPages = Math.ceil(total / PAGE_SIZE);
        const container = document.getElementById("pagination");
        if (totalPages <= 1) {
            container.innerHTML = "";
            return;
        }

        container.innerHTML = new Array(totalPages).fill(0).map((_, i) =>
            `<button class="${currentPage === i + 1 ? 'bg-cyan-400 text-slate-900' : 'glass'} h-9 w-9 rounded-lg"
            onclick="goToPage(${i + 1})">${i + 1}</button>`
        ).join("");
    }

    function goToPage(page) {
        currentPage = page;
        renderBookingsTable(filteredBookings);
    }

    function filterBookings() {
        const q = document.getElementById("bookingSearchInput").value.toLowerCase();
        const status = document.getElementById("statusFilter").value;

        filteredBookings = allBookings.filter(b => {
            const matchText = !q || (b.bookingCode || "").toLowerCase().includes(q) || (b.tourName || "").toLowerCase().includes(q);
            const matchStatus = !status || b.status === status;
            return matchText && matchStatus;
        });

        currentPage = 1;
        renderBookingsTable(filteredBookings);
    }

    async function loadBookings() {
        const data = await api("/bookings/admin/all");
        if (data.success && data.data) {
            allBookings = data.data;
            filteredBookings = [...allBookings];
            renderBookingsTable(filteredBookings);
            updateStats();
        } else {
            document.getElementById("bookingsTableBody").innerHTML =
                `<tr><td colspan="7" class="p-8 text-center text-rose-400">Failed to load bookings</td></tr>`;
        }
    }

    function updateStats() {
        document.getElementById("totalBookings").textContent = allBookings.length;
        document.getElementById("pendingBookings").textContent = allBookings.filter(b => b.status === "PENDING").length;
        document.getElementById("confirmedBookings").textContent = allBookings.filter(b => b.status === "CONFIRMED").length;
        document.getElementById("completedBookings").textContent = allBookings.filter(b => b.status === "COMPLETED").length;
    }

    function viewBooking(id) {
        const booking = allBookings.find(b => b.id === id);
        if (!booking) return;

        currentBookingId = id;
        document.getElementById("bookingDetails").innerHTML = `
        <div class="flex justify-between"><span class="text-slate-400">Booking Code</span><span class="font-semibold">${booking.bookingCode}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">User</span><span>${booking.userName}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Tour</span><span>${booking.tourName}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Departure Date</span><span>${formatDate(booking.departureDate)}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Adults</span><span>${booking.numAdults}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Children</span><span>${booking.numChildren}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Pickup Location</span><span>${booking.pickupLocation || "-"}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Payment Method</span><span>${booking.paymentMethod || "-"}</span></div>
        <div class="flex justify-between text-lg mt-2 pt-2 border-t border-white/10">
            <span class="text-slate-400">Total</span><span class="font-bold text-cyan-300">${fmtPrice(booking.totalPrice)}</span>
        </div>
    `;

        document.getElementById("viewBookingModal").classList.remove("hidden");
        document.getElementById("viewBookingModal").classList.add("flex");
    }

    function closeViewModal() {
        document.getElementById("viewBookingModal").classList.add("hidden");
        document.getElementById("viewBookingModal").classList.remove("flex");
        currentBookingId = null;
    }

    async function updateStatus(status) {
        const booking = allBookings.find(b => b.id === currentBookingId);
        if (!booking || !confirm(`Mark booking as ${status}?`)) return;

        const data = await api(`/bookings/admin/${currentBookingId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status })
        });

        if (data.success) {
            closeViewModal();
            loadBookings();
        } else {
            alert(data.message || "Failed to update booking");
        }
    }

    document.addEventListener("DOMContentLoaded", loadBookings);
</script>
</body>
</html>
