<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users Management - SmartTravel Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"],
                    },
                }
            }
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dark font-sans antialiased bg-slate-900">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-800/95 backdrop-blur-xl border-r border-white/10 z-40">
        <div class="flex h-20 items-center justify-center border-b border-white/10">
            <div class="text-center">
                <p class="text-xl font-black tracking-tight"><span class="text-cyan-300">Smart</span><span>Travel</span></p>
                <p class="text-xs text-slate-400">Admin Panel</p>
            </div>
        </div>

        <nav class="p-4 space-y-2">
            <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-chart-line w-5"></i>
                <span class="font-semibold">Dashboard</span>
            </a>
            <a href="users.html" class="flex items-center gap-3 rounded-xl px-4 py-3 bg-cyan-500/20 text-cyan-300">
                <i class="fa-solid fa-users w-5"></i>
                <span class="font-semibold">Users</span>
            </a>
            <a href="bookings.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-ticket w-5"></i>
                <span class="font-semibold">Bookings</span>
            </a>
            <a href="reviews.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition">
                <i class="fa-solid fa-star w-5"></i>
                <span class="font-semibold">Reviews</span>
            </a>
            <a href="../index.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-white/10 transition mt-6">
                <i class="fa-solid fa-arrow-left w-5"></i>
                <span class="font-semibold">Back to Site</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8">
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-black">Users Management</h1>
                <p class="text-slate-400 mt-1">Manage and view all registered users</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="glass rounded-xl px-4 py-2 text-sm">
                    <i class="fa-solid fa-user-circle mr-2"></i>
                    Admin
                </div>
            </div>
        </header>

        <!-- Search & Filter -->
        <div class="glass rounded-2xl p-4 mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex-1 min-w-[200px]">
                    <input id="userSearchInput" type="text" placeholder="Search users by name or email..."
                           class="w-full rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" oninput="filterUsers()" />
                </div>
                <select id="roleFilter" class="rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" onchange="filterUsers()">
                    <option value="">All Roles</option>
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
        </div>

        <!-- Users Table -->
        <div class="glass rounded-2xl overflow-hidden">
            <table class="w-full">
                <thead class="border-b border-white/10">
                <tr class="text-left text-sm text-slate-400">
                    <th class="p-4 font-medium">User</th>
                    <th class="p-4 font-medium">Email</th>
                    <th class="p-4 font-medium">Phone</th>
                    <th class="p-4 font-medium">Role</th>
                    <th class="p-4 font-medium">Joined</th>
                    <th class="p-4 font-medium">Actions</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                <tr>
                    <td colspan="6" class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                        <p>Loading users...</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div id="pagination" class="mt-4 flex justify-center gap-2"></div>
    </main>
</div>

<!-- Edit User Modal -->
<div id="editUserModal" class="fixed inset-0 z-[999] hidden bg-black/70 p-4" style="backdrop-filter:blur(4px)">
    <div class="flex items-center justify-center min-h-full">
        <div class="glass w-full max-w-md rounded-2xl p-6" style="background:#1e293b;border:1px solid rgba(255,255,255,0.12)">
            <div class="flex items-center justify-between mb-4">
                <h4 class="text-xl font-bold">Edit User</h4>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="editUserForm" class="space-y-4">
                <input type="hidden" id="editUserId" />
                <div>
                    <label class="text-sm text-slate-400">Full Name</label>
                    <input id="editUserName" type="text" class="mt-1 w-full rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" />
                </div>
                <div>
                    <label class="text-sm text-slate-400">Email</label>
                    <input id="editUserEmail" type="email" class="mt-1 w-full rounded-xl border border-white/10 bg-white/10 px-4 py-2.5" />
                </div>
                <div>
                    <label class="text-sm text-slate-400">Role</label>
                    <select id="editUserRole" class="mt-1 w-full rounded-xl border border-white/10 bg-white/10 px-4 py-2.5">
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <button onclick="saveUser()" class="w-full rounded-xl bg-gradient-to-r from-cyan-400 to-emerald-400 py-3 font-bold text-slate-900">
                    Save Changes
                </button>
            </div>
        </div>
    </div>
</div>

<script>

    // Auth guard
    (function() {
        const token = localStorage.getItem("adminToken");
        const role = localStorage.getItem("adminRole");
        if (!token || role !== "ADMIN") {
            window.location.href = "/admin/login.html";
        }
    })();
    const API = "/api";
    let allUsers = [];
    let filteredUsers = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;

    async function api(path, opts = {}) {
        try {
            const token = localStorage.getItem("adminToken");
            if (!token) { window.location.href = "/admin/login.html"; return { success: false, data: null }; }
            opts.headers = { ...(opts.headers || {}), "Authorization": "Bearer " + token };
            const response = await fetch(API + path, opts);
            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem("adminToken");
                window.location.href = "/admin/login.html";
                return { success: false, data: null };
            }
            const data = await response.json();
            return data;
        } catch (e) {
            return { success: false, data: null };
        }
    }

    function formatDate(dateStr) {
        if (!dateStr) return "-";
        return new Date(dateStr).toLocaleDateString("vi-VN", { day: "numeric", month: "short", year: "numeric" });
    }

    function getAvatarUrl(name) {
        return `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name || "User")}&backgroundColor=22d3ee,10b981,a855f7,ec4899,6366f1&backgroundType=gradientLinear`;
    }

    function renderUsersTable(users) {
        const tbody = document.getElementById("usersTableBody");
        if (!users || users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">No users found</td></tr>`;
            return;
        }

        const start = (currentPage - 1) * PAGE_SIZE;
        const pageUsers = users.slice(start, start + PAGE_SIZE);

        tbody.innerHTML = pageUsers.map(u => `
        <tr class="border-b border-white/5 hover:bg-white/5 transition">
            <td class="p-4">
                <div class="flex items-center gap-3">
                    <img src="${getAvatarUrl(u.fullName)}" alt="${u.fullName}" class="h-10 w-10 rounded-full" />
                    <span class="font-semibold">${u.fullName || "-"}</span>
                </div>
            </td>
            <td class="p-4 text-slate-300">${u.email || "-"}</td>
            <td class="p-4 text-slate-300">${u.phone || "-"}</td>
            <td class="p-4">
                <span class="px-2 py-1 rounded-full text-xs ${u.role === 'ADMIN' ? 'bg-cyan-500/20 text-cyan-400' : 'bg-white/10 text-slate-300'}">
                    ${u.role || 'USER'}
                </span>
            </td>
            <td class="p-4 text-slate-300 text-sm">${formatDate(u.createdAt)}</td>
            <td class="p-4">
                <div class="flex gap-2">
                    <button onclick="openEditModal(${u.id})" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-slate-300" title="Edit">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button onclick="deleteUser(${u.id})" class="p-2 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-400" title="Delete">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </td>
        </tr>
    `).join("");

        renderPagination(users.length);
    }

    function renderPagination(total) {
        const totalPages = Math.ceil(total / PAGE_SIZE);
        const container = document.getElementById("pagination");
        if (totalPages <= 1) {
            container.innerHTML = "";
            return;
        }

        container.innerHTML = new Array(totalPages).fill(0).map((_, i) =>
            `<button class="${currentPage === i + 1 ? 'bg-cyan-400 text-slate-900' : 'glass'} h-9 w-9 rounded-lg"
            onclick="goToPage(${i + 1})">${i + 1}</button>`
        ).join("");
    }

    function goToPage(page) {
        currentPage = page;
        renderUsersTable(filteredUsers);
    }

    function filterUsers() {
        const q = document.getElementById("userSearchInput").value.toLowerCase();
        const role = document.getElementById("roleFilter").value;

        filteredUsers = allUsers.filter(u => {
            const matchText = !q || (u.fullName || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q);
            const matchRole = !role || u.role === role;
            return matchText && matchRole;
        });

        currentPage = 1;
        renderUsersTable(filteredUsers);
    }

    async function loadUsers() {
        const data = await api("/users");
        if (data.success && data.data) {
            allUsers = data.data;
            filteredUsers = [...allUsers];
            renderUsersTable(filteredUsers);
        } else {
            document.getElementById("usersTableBody").innerHTML =
                `<tr><td colspan="6" class="p-8 text-center text-rose-400">Failed to load users</td></tr>`;
        }
    }

    function openEditModal(id) {
        const user = allUsers.find(u => u.id === id);
        if (!user) return;

        document.getElementById("editUserId").value = id;
        document.getElementById("editUserName").value = user.fullName || "";
        document.getElementById("editUserEmail").value = user.email || "";
        document.getElementById("editUserRole").value = user.role || "USER";

        const m = document.getElementById("editUserModal"); m.classList.remove("hidden"); m.style.display="flex"; m.style.alignItems="center"; m.style.justifyContent="center";
    }

    function closeEditModal() {
        const m = document.getElementById("editUserModal"); m.classList.add("hidden"); m.style.display="";
    }

    async function saveUser() {
        const id = document.getElementById("editUserId").value;
        const name = document.getElementById("editUserName").value;
        const role = document.getElementById("editUserRole").value;

        const data = await api(`/users/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullName: name, role })
        });

        if (data.success) {
            closeEditModal();
            loadUsers();
        } else {
            alert(data.message || "Failed to update user");
        }
    }

    async function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;

        const data = await api(`/users/${id}`, { method: "DELETE" });
        if (data.success) {
            loadUsers();
        } else {
            alert(data.message || "Failed to delete user");
        }
    }

    document.addEventListener("DOMContentLoaded", loadUsers);
</script>
</body>
</html>
