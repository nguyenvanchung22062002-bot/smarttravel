# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests
spring.flyway.enabled=false

# JWT test secret
app.jwt.secret=TestSecretKeyForUnitTestingMinimum32Chars!!
app.jwt.expiration-ms=3600000

# Gemini
gemini.api-key=test-key-not-used

# Payment
payment.vnpay.tmn-code=TEST
payment.vnpay.hash-secret=TEST_HASH
payment.momo.partner-code=TEST
payment.momo.access-key=TEST
payment.momo.secret-key=TEST
